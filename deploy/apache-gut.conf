# gutnumber vhost. certbot --apache copies this into an -le-ssl vhost and adds the redirect.
<VirtualHost *:80>
    ServerName {{HOST}}
    ErrorLog ${APACHE_LOG_DIR}/gut/error.log
    CustomLog ${APACHE_LOG_DIR}/gut/access.log combined

    # Whole site behind basic auth (D11). CORS preflights (bookmarklet), /health and ACME challenges stay open.
    <Location />
        AuthType Basic
        AuthName "gutnumber"
        AuthUserFile /etc/apache2/gut.htpasswd
        # (not <If>/<Else>: those merge after <Location> and would override the exemptions below)
        <RequireAny>
            Require method OPTIONS
            Require valid-user
        </RequireAny>
    </Location>
    <Location /api/v1/health>
        Require all granted
    </Location>
    # Let's Encrypt http-01 challenges must reach certbot without a password.
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>
    RequestHeader set X-Forwarded-User "%{REMOTE_USER}s" env=REMOTE_USER
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPreserveHost On
    ProxyTimeout 90
    ProxyPass        /.well-known/ !
    ProxyPass        / http://127.0.0.1:{{PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{PORT}}/
</VirtualHost>
